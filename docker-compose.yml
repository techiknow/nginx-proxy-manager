services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.build
    image: nginx-proxy-manager-source:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '${NETBIRD_IP:-127.0.0.1}:81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
