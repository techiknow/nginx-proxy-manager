services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.build
    image: nginx-proxy-manager-source:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
